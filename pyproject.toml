[project]
name = "icml26-spectral-minimax-rates"
version = "0.1.0"
description = "ICML 2026 reproduction audit for Alignment-Sensitive Minimax Rates for Spectral Algorithms"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
